<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="AI SaaS Foundation, in development: full-stack architecture, auth and organizations, RBAC and security, AI-ready infrastructure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AI SaaS Foundation — in development</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6f1"/><stop offset="1" stop-color="#fcfcfa"/></linearGradient>
<clipPath id="card"><rect width="1000" height="250" rx="24"/></clipPath></defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.legs-a{transform-origin:32px 33px;animation:la .22s linear infinite}
.legs-b{transform-origin:32px 33px;animation:lb .22s linear infinite}
.claw-l{transform-origin:17px 25px;animation:cl .5s ease-in-out infinite}
.claw-r{transform-origin:47px 25px;animation:cr .5s ease-in-out infinite}
@keyframes la{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes lb{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
@keyframes cl{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}}
@keyframes cr{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-12deg)}}
.walker{animation:walk 12s ease-in-out infinite}
@keyframes walk{0%,6%{transform:translateX(0);opacity:1}16%,26%{transform:translateX(240px)}38%,48%{transform:translateX(480px)}60%,90%{transform:translateX(720px);opacity:1}93%{transform:translateX(720px);opacity:0}94%,97%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
.n0{animation:lit0 12s step-end infinite}.r0{transform-box:fill-box;transform-origin:center;animation:ring0 12s ease-out infinite}.k0{animation:chk0 12s step-end infinite}
@keyframes lit0{0%{fill:#ead9cd}2%{fill:#ff6542}93%,100%{fill:#ead9cd}}
@keyframes chk0{0%{opacity:0}2%{opacity:1}93%,100%{opacity:0}}
@keyframes ring0{0%,2%{opacity:0;transform:scale(1)}2.1%{opacity:.9;transform:scale(1)}9%{opacity:0;transform:scale(2.4)}100%{opacity:0}}
.n1{animation:lit1 12s step-end infinite}.r1{transform-box:fill-box;transform-origin:center;animation:ring1 12s ease-out infinite}.k1{animation:chk1 12s step-end infinite}
@keyframes lit1{0%{fill:#ead9cd}22%{fill:#ff6542}93%,100%{fill:#ead9cd}}
@keyframes chk1{0%{opacity:0}22%{opacity:1}93%,100%{opacity:0}}
@keyframes ring1{0%,22%{opacity:0;transform:scale(1)}22.1%{opacity:.9;transform:scale(1)}29%{opacity:0;transform:scale(2.4)}100%{opacity:0}}
.n2{animation:lit2 12s step-end infinite}.r2{transform-box:fill-box;transform-origin:center;animation:ring2 12s ease-out infinite}.k2{animation:chk2 12s step-end infinite}
@keyframes lit2{0%{fill:#ead9cd}44%{fill:#ff6542}93%,100%{fill:#ead9cd}}
@keyframes chk2{0%{opacity:0}44%{opacity:1}93%,100%{opacity:0}}
@keyframes ring2{0%,44%{opacity:0;transform:scale(1)}44.1%{opacity:.9;transform:scale(1)}51%{opacity:0;transform:scale(2.4)}100%{opacity:0}}
.n3{animation:lit3 12s step-end infinite}.r3{transform-box:fill-box;transform-origin:center;animation:ring3 12s ease-out infinite}.k3{animation:chk3 12s step-end infinite}
@keyframes lit3{0%{fill:#ead9cd}66%{fill:#ff6542}93%,100%{fill:#ead9cd}}
@keyframes chk3{0%{opacity:0}66%{opacity:1}93%,100%{opacity:0}}
@keyframes ring3{0%,66%{opacity:0;transform:scale(1)}66.1%{opacity:.9;transform:scale(1)}73%{opacity:0;transform:scale(2.4)}100%{opacity:0}}

.g1{transform-origin:880px 62px;animation:spin 8s linear infinite}
.g2{transform-origin:931px 92px;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.dash{animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
