<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="GigaCrabs — Building technology worth using." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GigaCrabs — Building technology worth using.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6f1"/><stop offset="1" stop-color="#fcfcfa"/></linearGradient>
<clipPath id="card"><rect width="1000" height="300" rx="24"/></clipPath>
<clipPath id="typeclip"><rect class="typer" x="290" y="176" width="462" height="36"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
.hop{transform-origin:146px 245px;animation:hop .8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-5deg) scale(1.03,.95)}25%,75%{transform:translateY(-16px) rotate(0) scale(.97,1.04)}50%{transform:translateY(0) rotate(5deg) scale(1.03,.95)}}
.legs-a{transform-origin:32px 33px;animation:la .35s ease-in-out infinite}
.legs-b{transform-origin:32px 33px;animation:lb .35s ease-in-out infinite}
.claw-l{transform-origin:17px 25px;animation:cl .4s ease-in-out infinite}
.claw-r{transform-origin:47px 25px;animation:cr .4s ease-in-out infinite}
@keyframes la{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes lb{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
@keyframes cl{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(25deg)}}
@keyframes cr{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-25deg)}}
.w1{animation:slide 7s linear infinite}
.w2{animation:slide 5s linear infinite reverse}
@keyframes slide{to{transform:translateX(-250px)}}
.bub{opacity:0;animation:rise 5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-190px);opacity:0}}
.note{font-size:24px;font-weight:800;fill:#ff6542;opacity:0;animation:note 2.4s ease-out infinite}
@keyframes note{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.chip{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.in{animation:fadeup .9s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.typer{transform-box:fill-box;transform-origin:0 50%;animation:type 7s steps(32) infinite}
@keyframes type{0%{transform:scaleX(0)}50%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.cursor{animation:cur 7s steps(32) infinite,blink .8s step-end infinite}
@keyframes cur{0%{transform:translateX(0)}50%,88%{transform:translateX(462px)}100%{transform:translateX(0)}}
@keyframes blink{50%{fill:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.typer{transform:none}}
</style>
