<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Three little crabs on a beach at sunrise. Thanks for stopping by the shore." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Thanks for stopping by the shore</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1ea"/><stop offset="1" stop-color="#ffd9cc"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8a6e"/><stop offset="1" stop-color="#ff6542"/></radialGradient>
<clipPath id="card"><rect width="1000" height="270" rx="24"/></clipPath></defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.legs-a{transform-origin:32px 33px;animation:la .22s linear infinite}
.legs-b{transform-origin:32px 33px;animation:lb .22s linear infinite}
.claw-l{transform-origin:17px 25px;animation:cl .5s ease-in-out infinite}
.claw-r{transform-origin:47px 25px;animation:cr .5s ease-in-out infinite}
@keyframes la{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes lb{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
@keyframes cl{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}}
@keyframes cr{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-12deg)}}
.run{animation:run 9s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d))}}
.face{transform-box:fill-box;transform-origin:center;animation:face 18s step-end infinite}
@keyframes face{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.sun{animation:sun 8s ease-in-out infinite}
@keyframes sun{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.cloud{animation:cloud 40s linear infinite}
@keyframes cloud{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
.w1{animation:slide 8s linear infinite}.w2{animation:slide 6s linear infinite reverse}.w3{animation:slide 10s linear infinite}
@keyframes slide{to{transform:translateX(-250px)}}
.bottle{animation:drift 26s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(1080px)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bobb 2.4s ease-in-out infinite}
@keyframes bobb{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-5px) rotate(8deg)}}
.gl{opacity:0;animation:gl 3s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:0}50%{opacity:.9}}
.in{animation:fadeup 1s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="270" fill="url(#sky)"/>
