<g class="in">
<text x="500" y="96" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="-1" fill="#0f172a">Thanks for stopping by the <tspan fill="#ff6542">shore.</tspan></text>
<text x="500" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#7c5a4c">Say hi at hello@gigacrabs.com · gigacrabs.com</text></g>
