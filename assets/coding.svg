<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="A crab typing code at a desk with a cup of coffee" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A crab typing code at a desk with a cup of coffee</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6f1"/><stop offset="1" stop-color="#fcfcfa"/></linearGradient>
<clipPath id="card"><rect width="1000" height="280" rx="24"/></clipPath>
<clipPath id="c1"><rect class="t1" x="330" y="49" width="285.6" height="24"/></clipPath><clipPath id="c2"><rect class="t2" x="330" y="71" width="255.0" height="24"/></clipPath><clipPath id="c3"><rect class="t3" x="330" y="93" width="183.6" height="24"/></clipPath><clipPath id="c4"><rect class="t4" x="330" y="115" width="275.4" height="24"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
.t1{transform-box:fill-box;transform-origin:0 50%;animation:t1 10s steps(28) infinite}
.t2{transform-box:fill-box;transform-origin:0 50%;animation:t2 10s steps(25) infinite}
.t3{transform-box:fill-box;transform-origin:0 50%;animation:t3 10s steps(18) infinite}
.t4{transform-box:fill-box;transform-origin:0 50%;animation:t4 10s steps(27) infinite}

@keyframes t1{0%{transform:scaleX(0)}16%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes t2{0%,18%{transform:scaleX(0)}32%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes t3{0%,34%{transform:scaleX(0)}44%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes t4{0%,46%{transform:scaleX(0)}62%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.cur{opacity:0;animation:cur 10s step-end infinite}
@keyframes cur{0%,62%{opacity:0}66%{opacity:1}70%{opacity:0}74%{opacity:1}78%{opacity:0}82%{opacity:1}86%{opacity:0}90%{opacity:1}92%,100%{opacity:0}}
.bob{animation:bob .52s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(1.6px)}}
.arm-l{transform-origin:446px 205px;animation:tap .26s ease-in-out infinite alternate}
.arm-r{transform-origin:554px 205px;animation:tap .26s ease-in-out infinite alternate-reverse}
@keyframes tap{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.k1{animation:key .26s steps(1) infinite alternate}
.k2{animation:key .26s steps(1) infinite alternate-reverse}
@keyframes key{from{fill:#ff6542}to{fill:#f3e3d8}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.steam{fill:none;stroke:#d9c2b5;stroke-width:3;stroke-linecap:round;opacity:0;animation:steam 2.6s ease-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.fl{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.dot{animation:dot 1.2s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.t1,.t2,.t3,.t4{transform:none}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="280" fill="url(#bg)"/>
<text class="mono fl" x="70" y="120" font-size="30" fill="#ffb199" style="animation-delay:0s">{ }</text><text class="mono fl" x="190" y="190" font-size="24" fill="#ffb199" style="animation-delay:1.2s">&lt;/&gt;</text><text class="mono fl" x="60" y="215" font-size="22" fill="#ffb199" style="animation-delay:2.2s">=&gt;</text><text class="mono fl" x="790" y="90" font-size="28" fill="#ffb199" style="animation-delay:0.6s">01</text><text class="mono fl" x="880" y="160" font-size="30" fill="#ffb199" style="animation-delay:1.8s">{ }</text><text class="mono fl" x="800" y="200" font-size="22" fill="#ffb199" style="animation-delay:2.6s">;</text>
<rect x="0" y="252" width="1000" height="28" fill="#ffd9cd"/>
<rect x="0" y="252" width="1000" height="3" fill="#ffc2b0"/>

<!-- pill -->
<rect x="32" y="26" width="212" height="34" rx="17" fill="#fff" stroke="#ffd9cc" stroke-width="1.5"/>
<circle cx="52" cy="43" r="4.5" fill="#ff6542"/>
<text x="66" y="48" font-size="15" font-weight="700" fill="#d83f22">currently coding</text>
