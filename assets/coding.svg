<circle cx="481" cy="149" r="5.5" fill="#172033"/><circle cx="525" cy="149" r="5.5" fill="#172033"/></g>
<path d="M488 222 Q500 232 512 222" stroke="#172033" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>

<!-- keyboard -->
<rect x="424" y="236" width="152" height="20" rx="5" fill="#fff" stroke="#e2c4b4" stroke-width="1.5"/>
<rect x="436" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="449" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="462" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="475" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="488" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="501" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="514" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="527" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="540" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="553" y="242" width="9" height="5" rx="1.5" fill="#f3e3d8"/><rect x="436" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="449" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="462" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="475" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="488" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="501" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="514" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="527" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="540" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/><rect x="553" y="249" width="9" height="3.5" rx="1.5" fill="#f3e3d8"/>
<rect class="k1" x="462" y="242" width="9" height="5" rx="1.5"/><rect class="k2" x="527" y="242" width="9" height="5" rx="1.5"/>

