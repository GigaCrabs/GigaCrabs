<circle cx="308" cy="42" r="3.5" fill="#ff6542"/><circle cx="321" cy="42" r="3.5" fill="#fbbf24"/><circle cx="334" cy="42" r="3.5" fill="#34d399"/>
<text class="mono" x="308" y="66" font-size="14" fill="#475569">1</text><g clip-path="url(#c1)"><text class="mono" x="330" y="66" font-size="17" textLength="285.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff8a6e">const</tspan> <tspan fill="#e2e8f0">crab</tspan> <tspan fill="#94a3b8">=</tspan> <tspan fill="#ff8a6e">new</tspan> <tspan fill="#5eead4">GigaCrab</tspan><tspan fill="#e2e8f0">();</tspan></text></g><text class="mono" x="308" y="88" font-size="14" fill="#475569">2</text><g clip-path="url(#c2)"><text class="mono" x="330" y="88" font-size="17" textLength="255.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#e2e8f0">crab.</tspan><tspan fill="#fbbf24">build</tspan><tspan fill="#e2e8f0">({ ai: </tspan><tspan fill="#5eead4">true</tspan><tspan fill="#e2e8f0"> });</tspan></text></g><text class="mono" x="308" y="110" font-size="14" fill="#475569">3</text><g clip-path="url(#c3)"><text class="mono" x="330" y="110" font-size="17" textLength="183.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff8a6e">await</tspan> <tspan fill="#e2e8f0">crab.</tspan><tspan fill="#fbbf24">ship</tspan><tspan fill="#e2e8f0">();</tspan></text></g><text class="mono" x="308" y="132" font-size="14" fill="#475569">4</text><g clip-path="url(#c4)"><text class="mono" x="330" y="132" font-size="17" textLength="275.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#64748b">// shipped. now more coffee</tspan></text></g>
<rect class="cur" x="607.4" y="116" width="9" height="19" fill="#ff6542"/>

<!-- crab -->
<g class="bob">
<g stroke="#d83f22" stroke-width="7" stroke-linecap="round" fill="none">
<path d="M452 224 L428 247"/><path d="M466 234 L452 251"/><path d="M548 224 L572 247"/><path d="M534 234 L548 251"/>
</g>
<ellipse cx="500" cy="212" rx="64" ry="40" fill="#ff6542"/>
<ellipse cx="482" cy="195" rx="34" ry="14" fill="#ff8a6e" opacity=".5"/>
<g stroke="#d83f22" stroke-width="5" stroke-linecap="round"><path d="M482 178 L479 162"/><path d="M518 178 L521 162"/></g>
