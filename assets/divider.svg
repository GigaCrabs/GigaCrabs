<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="A little crab scuttling back and forth" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A little crab scuttling back and forth</title>
<style>
.run{animation:run 6s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(900px)}}
.face{transform-box:fill-box;transform-origin:center;animation:face 12s step-end infinite}
@keyframes face{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.bob{animation:bob .2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.legs-a{transform-origin:32px 33px;animation:la .18s linear infinite}
.legs-b{transform-origin:32px 33px;animation:lb .18s linear infinite}
.claw-l{transform-origin:17px 25px;transform:rotate(-8deg)}
.claw-r{transform-origin:47px 25px;transform:rotate(8deg)}
@keyframes la{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes lb{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<line x1="8" y1="54" x2="992" y2="54" stroke="#ffc2b0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12"/>
<g class="run"><g class="face"><g class="bob"><svg x="20" y="18" width="52" height="36" viewBox="0 0 64 44" overflow="visible">
<ellipse cx="32" cy="43" rx="18" ry="1.6" fill="#0f172a" opacity=".12"/>
<g stroke="#d83f22" stroke-width="2.6" stroke-linecap="round" fill="none">
<g class="legs-a"><path d="M20 31 10 38"/><path d="M26 36 22 43"/><path d="M42 34 50 42"/></g>
<g class="legs-b"><path d="M22 34 14 42"/><path d="M44 31 54 38"/><path d="M38 36 42 43"/></g></g>
<g class="claw-l"><path d="M17 25 10 15" stroke="#d83f22" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="7.5" cy="10" rx="4" ry="6" transform="rotate(-18 7.5 10)" fill="#ff6542"/>
<ellipse cx="13" cy="11" rx="3.2" ry="5.2" transform="rotate(25 13 11)" fill="#ed4f2f"/></g>
<g class="claw-r"><path d="M47 25 54 15" stroke="#d83f22" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="56.5" cy="10" rx="4" ry="6" transform="rotate(18 56.5 10)" fill="#ff6542"/>
<ellipse cx="51" cy="11" rx="3.2" ry="5.2" transform="rotate(-25 51 11)" fill="#ed4f2f"/></g>
<ellipse cx="32" cy="27" rx="18" ry="11.5" fill="#ff6542"/>
<ellipse cx="29" cy="23" rx="10" ry="5" fill="#ff8a6e" opacity=".55"/>
<g stroke="#d83f22" stroke-width="2" stroke-linecap="round"><path d="M26 17 25 11"/><path d="M38 17 39 11"/></g>
<circle cx="25" cy="10" r="3.4" fill="#fff"/><circle cx="39" cy="10" r="3.4" fill="#fff"/>
<circle cx="25.6" cy="10.4" r="1.6" fill="#172033"/><circle cx="39.6" cy="10.4" r="1.6" fill="#172033"/>
<path d="M28 29 Q32 33 36 29" stroke="#172033" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg></g></g></g>
</svg>
